services:
  portal:
    build: .
    image: result-portal:1.0
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portaluser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-results}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-results}
      POSTGRES_USER: ${POSTGRES_USER:-portaluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["result_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-portaluser} -d ${POSTGRES_DB:-results}"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped
volumes:
  result_data:
